[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wred-auth"
version = "0.1.0"
description = "Optional auth integration for Wred"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["wred>=0.13,<0.15", "argon2-cffi>=23", "PyJWT[crypto]>=2.9,<3", "cryptography>=43", "authlib>=1.3,<2", "httpx>=0.27", "pyotp>=2.9,<3", "wred-ratelimit>=0.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "wred-pydantic>=0.2,<0.3"]
mongodb = ["pymongo>=4.13,<5"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.13", "aiosqlite>=0.20", "asyncpg>=0.29"]

[tool.flit.sdist]
include = ["tests/*.py", "benchmarks/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
